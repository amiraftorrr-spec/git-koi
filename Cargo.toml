[package]
name = "git-koi"
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
description = "Draw Amir's lively, language-colored koi as a looping GIF for a profile README."
repository = "https://github.com/amiraftorrr-spec/git-koi"
documentation = "https://docs.rs/git-koi"
readme = "README.md"
license = "MIT"
keywords = ["github", "profile", "koi", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
